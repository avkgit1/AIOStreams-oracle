services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - /opt/gluetun/wireguard/wg0.conf:/gluetun/wireguard/wg0.conf:ro

    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: on
      HTTPPROXY_STEALTH: on

    ports:
      - "8888:8888"

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped

    depends_on:
      gluetun:
        condition: service_healthy

    ports:
      - "${PORT:-3000}:3000"

    environment:
      BASE_URL: ${BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URI: ${DATABASE_URI}
      AIOSTREAMS_AUTH: ${AIOSTREAMS_AUTH}
      TRUSTED_UUIDS: ${TRUSTED_UUIDS}

      # Send upstream addon requests through Proton VPN
      ADDON_PROXY: http://gluetun:8888
      ADDON_PROXY_CONFIG: "*:false,*.strem.fun:true"

    volumes:
      - aiostreams_data:/app/data

volumes:
  aiostreams_data:
